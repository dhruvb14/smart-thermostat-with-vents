name: "CodeQL Issue Sync"

on:
  schedule:
    - cron: '0 6 * * *'  # Daily (#414) — hourly was ~24 mostly-no-op runs/day
  workflow_dispatch:

jobs:
  create_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      security-events: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Create issues for open CodeQL alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Fetch all open code scanning alerts
          ALERTS=$(gh api repos/$GH_REPO/code-scanning/alerts \
            --jq '.[] | select(.state=="open") | {number: .number, desc: .rule.description, tool: .tool.name, url: .html_url}' \
            -X GET -f state=open 2>/dev/null || echo "")

          if [ -z "$ALERTS" ]; then
            echo "No open code scanning alerts found."
            exit 0
          fi

          # `gh issue create --label` fails outright when a label is missing,
          # and `codeql` never existed in this repo, so alert #206 (2026-07)
          # went unfiled every day. Create whichever label is missing first;
          # an existing label is left exactly as it is.
          ensure_label() {
            gh api "repos/$GH_REPO/labels/$1" --silent 2>/dev/null ||
              gh label create "$1" --repo "$GH_REPO" --color "$2" --description "$3"
          }
          ensure_label security d73a4a "Security-related issue or alert"
          ensure_label codeql 5319e7 "Mirrored from a code scanning alert"

          FAILED=0
          while IFS= read -r ALERT; do
            ALERT_NUMBER=$(echo "$ALERT" | jq -r '.number')
            ALERT_DESC=$(echo "$ALERT" | jq -r '.desc')
            ALERT_TOOL=$(echo "$ALERT" | jq -r '.tool')
            ALERT_URL=$(echo "$ALERT" | jq -r '.url')

            # Check if an issue for this alert already exists
            EXISTING_ISSUE=$(gh issue list --repo "$GH_REPO" \
              --search "\"CodeQL Alert #$ALERT_NUMBER\" in:title" \
              --state open --json number -q '.[0].number')

            if [ -z "$EXISTING_ISSUE" ]; then
              TITLE_FULL="CodeQL Alert #$ALERT_NUMBER: $ALERT_DESC"
              TITLE_TRUNC=$(echo "$TITLE_FULL" | cut -c1-200)

              BODY_TEXT=$(cat <<EOF
          A new security alert has been detected by **$ALERT_TOOL**.

          **Description:** $ALERT_DESC
          **Alert Link:** $ALERT_URL

          Please review and remediate this alert.
          EOF
          )

              gh issue create --repo "$GH_REPO" \
                --title "$TITLE_TRUNC" \
                --label "security,codeql" \
                --body "$BODY_TEXT" || { echo "::error::Failed to create issue for alert #$ALERT_NUMBER"; FAILED=1; }
            else
              echo "Issue already exists for alert #$ALERT_NUMBER (issue #$EXISTING_ISSUE). Skipping."
            fi
          done <<< "$ALERTS"

          # Fail the run when any issue could not be filed. The old
          # `|| echo` kept the job green, which is how a missing label went
          # unnoticed for months.
          exit "$FAILED"
