name: Beta channel

# The beta add-on (slug plenum_beta) tracks the tip of main. `main` is PR-only
# (branch ruleset: no direct pushes), so the version + changelog "pointer" is
# written INTO each feature PR — landing on main at merge — and the image is
# built afterwards on push. Neither job ever pushes to main. See issue #465.
#
#   • On a pull request → main:  update-pointer
#       Compute the beta version, regenerate smart_vent_beta/CHANGELOG.md
#       (including THIS PR's title), bump smart_vent_beta/config.yaml, and commit
#       both onto the PR's OWN branch with GITHUB_TOKEN. No image build here.
#
#   • On push to main (after merge), or a manual dispatch:  publish-image
#       The pointer is already merged, so read main's version, ask GHCR whether
#       that tag exists, and build+push the multi-arch image if it doesn't. A
#       registry push, never a git push to main.
#
#       The check is against the REGISTRY rather than the push's own diff, so
#       the channel converges on main instead of depending on one particular
#       push run existing — see the comment on the version-check step.
#
# Stable/release publishing is unchanged (tag -> release-pr.yml -> release/v* PR
# -> container-ci publishes :version + :latest). Both jobs skip release PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual escape hatch. GitHub does not always dispatch a push run — issue #546
  # merged to main and produced no repository workflow runs at all, so the beta
  # image for that version was never built and there was nothing to re-run.
  # Without this trigger the only recovery was to wait for some future PR to
  # bump the pointer again.
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-push even if the tag already exists"
        type: boolean
        default: false

permissions:
  contents: write   # update-pointer commits to the PR branch
  packages: write   # publish-image pushes to GHCR

concurrency:
  group: beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BETA_IMAGE: ghcr.io/dhruvb14/plenum-beta
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── PR: write the beta version + changelog onto the PR branch. ──────────────
  # GITHUB_TOKEN commits don't re-trigger workflows, so this never loops; the
  # version counter excludes smart_vent_beta/ so the bot's own commits can't
  # inflate it. Same-repo PRs only — a fork's token can't write its branch.
  update-pointer:
    name: Update beta pointer (in PR)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0            # need tags + history for describe/rev-list
          token: ${{ secrets.GITHUB_TOKEN }}

      # A docs-only PR produces a byte-identical addon image (the Docker context
      # is ./smart_vent — root markdown, .claude/, .jules/, .vscode/, docs/, and
      # screenshots are not in it), so bumping the beta pointer would trigger a
      # pointless multi-arch beta rebuild on merge. Skip the bump for docs-only
      # PRs. Monotonicity is preserved: the beta build counter is derived from
      # origin/main's commit count, so the next code PR's counter still advances
      # past this docs merge. Same ignore set as lint.yml / container-ci.yml;
      # .github/ is intentionally code so a workflow change still bumps beta.
      - name: Classify diff (skip bump on docs-only)
        id: classify
        run: |
          git fetch --quiet origin main
          if git diff --name-only origin/main...HEAD > /tmp/changed.txt 2>/dev/null \
             && ! grep -vE '^(docs/|\.claude/|\.jules/|\.vscode/|screenshots/|e2e/screenshots/)|^[^/]+\.md$' /tmp/changed.txt | grep -q .; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only PR — beta pointer bump skipped (no beta rebuild on merge)."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write beta pointer onto the PR branch
        if: steps.classify.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --tags --quiet origin
          git fetch --quiet origin main
          # Betas build toward the NEXT MINOR after the last minor tag (v*.*.0).
          LAST_MINOR_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.0' 2>/dev/null || echo "")
          if [ -z "$LAST_MINOR_TAG" ]; then
            BASE="0.0.0"
          else
            BASE="${LAST_MINOR_TAG#v}"
          fi
          IFS=. read -r MAJ MIN PAT <<< "$BASE"
          NEXT_MINOR="${MAJ}.$((MIN + 1)).0"

          # Build counter is derived from origin/main (the linear, squash-merged
          # mainline) — NOT this PR's branch. Counting the branch was the bug: a
          # large feature branch inflated the count while a fix branched off the
          # squash-merged main deflated it, so the beta version went BACKWARDS
          # (0.31.0-beta.20 -> -beta.7) and Home Assistant stopped offering the
          # update. main only ever grows, so counting it is monotonic across
          # squash merges. ':!smart_vent_beta' excludes this job's own pointer
          # commits from the count.
          if [ -z "$LAST_MINOR_TAG" ]; then
            BUILD=$(git rev-list --count origin/main)
          else
            BUILD=$(git rev-list --count "${LAST_MINOR_TAG}..origin/main" -- ':!smart_vent_beta' 2>/dev/null \
                    || git rev-list --count "${LAST_MINOR_TAG}..origin/main")
          fi

          # Anti-regression floor: never emit a beta number <= the highest one
          # ALREADY recorded on main for this minor line. Scanning the full history
          # of the beta manifest (not just its current value) keeps the counter
          # monotonic even across the one-time history rewrite that lowered it, and
          # regardless of the order PRs merge in. A new minor line has no prior
          # betas, so it resets naturally (a higher minor sorts above regardless).
          NEXT_MINOR_RE=$(printf '%s' "$NEXT_MINOR" | sed 's/\./\\./g')
          HIST_MAX=$(git log origin/main -p -- smart_vent_beta/config.yaml 2>/dev/null \
            | grep -oE "${NEXT_MINOR_RE}-beta\.[0-9]+" | sed 's/.*-beta\.//' | sort -n | tail -1)
          if [ -n "$HIST_MAX" ] && [ "$BUILD" -le "$HIST_MAX" ]; then
            BUILD=$((HIST_MAX + 1))
          fi

          BETA="${NEXT_MINOR}-beta.${BUILD}"
          echo "Beta version for this PR: ${BETA} (monotonic on main; floored at prior betas)"

          sed -i "s/^version:.*/version: \"${BETA}\"/" smart_vent_beta/config.yaml
          bash .github/scripts/gen-beta-changelog.sh "${BETA}" > smart_vent_beta/CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add smart_vent_beta/config.yaml smart_vent_beta/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Beta pointer already up to date for this PR."
            exit 0
          fi
          git commit -m "chore(beta): update pointer to ${BETA}"
          git push origin "HEAD:${HEAD_REF}"

  # ── push to main (after merge): build + push the image for the merged version.
  # Builds whenever the registry does not already carry main's beta version, so
  # the channel converges on main rather than depending on one push landing.
  # Never writes to main.
  publish-image:
    name: Publish beta image
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !contains(github.event.head_commit.message, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Needed before the version check below, which asks the registry what is
      # already published.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compare main against the REGISTRY, not against this push's diff.
      #
      # This used to ask "did this push touch smart_vent_beta/config.yaml?"
      # (git diff HEAD^ HEAD). That question is only equivalent to "does the
      # channel need a build?" if every pointer bump gets its own push run —
      # and it doesn't. When #546 merged, GitHub dispatched no repository
      # workflow runs for the merge commit at all: main advanced to
      # 0.35.0-beta.3 while the registry stayed on beta.2. Because the pointer
      # bump was then several commits back, every subsequent push answered
      # "unchanged — nothing to build", so the channel would have stayed behind
      # until some unrelated PR happened to bump the pointer again.
      #
      # Asking the registry makes the job idempotent and self-healing: it is a
      # no-op while the tag exists, and any later push (or a manual dispatch)
      # rebuilds a version that went missing, whatever the reason.
      - name: Read beta version + decide whether to build
        id: ver
        env:
          FORCE: ${{ inputs.force }}
        run: |
          BETA=$(grep '^version:' smart_vent_beta/config.yaml | sed 's/version:[[:space:]]*//' | tr -d '"')
          echo "beta=${BETA}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch with force — rebuilding ${BETA}."
          elif docker manifest inspect "${BETA_IMAGE}:${BETA}" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${BETA_IMAGE}:${BETA} is already published — nothing to build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${BETA_IMAGE}:${BETA} is not in the registry — building it."
          fi

      - name: Stamp the beta version into the build context (runner-only)
        if: steps.ver.outputs.changed == 'true'
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.ver.outputs.beta }}\"/" smart_vent/config.yaml

      - name: Set up QEMU
        if: steps.ver.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.ver.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build & push beta image (multi-arch)
        if: steps.ver.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./smart_vent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BETA_IMAGE }}:${{ steps.ver.outputs.beta }}
            ${{ env.BETA_IMAGE }}:latest
          # Bakes the red-ribbon "BETA" apple-touch-icon into the frontend
          # bundle instead of stable's icon — see the Dockerfile ARG.
          build-args: |
            APPLE_TOUCH_ICON_VARIANT=beta
          cache-from: type=gha
          cache-to: type=gha,mode=max
