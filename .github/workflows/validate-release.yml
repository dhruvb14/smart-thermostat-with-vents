name: Validate Release

# Dry-run release validation — builds the Docker image, runs the full test
# suite, smoke-tests the container against /api/healthz, and runs E2E visual
# regression tests against a live HA + Plenum stack.
# Nothing is pushed. Run this before tagging to confirm a commit is releasable.
#
# Triggers:
#   • workflow_dispatch — manual run against any ref (the original entry point).
#   • pull_request to main — but the job only runs for release/v* PRs (gated by
#     the job-level `if` below). The release PR is opened by the bot with
#     GITHUB_TOKEN, so GitHub's loop guard means it won't auto-start; start it
#     with one click from the PR's checks ("Run"/"Approve and run"). This is the
#     extra pre-release test pass the release reviewer wants without having to
#     hunt for the workflow in the Actions tab. See #337.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to validate (defaults to current branch)"
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths-ignore:
      - 'e2e/screenshots/**'

env:
  # Clear the Node.js 20 deprecation warning from docker/setup-buildx-action by
  # opting this workflow's JS actions into the Node.js 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Release Validation
    # Manual dispatch always runs; on a PR, only for release/v* branches.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart_vent/frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install ".[dev]"
        working-directory: smart_vent

      - name: Python lint
        run: |
          ruff check backend/
          ruff format --check backend/
        working-directory: smart_vent

      - name: Python tests
        run: python -m pytest backend/tests/ -v
        working-directory: smart_vent

      - name: Install frontend dependencies
        run: npm ci
        working-directory: smart_vent/frontend

      - name: Frontend lint
        run: |
          npm run lint
          npm run format:check
        working-directory: smart_vent/frontend

      - name: Frontend tests
        run: npm run test:coverage
        working-directory: smart_vent/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set version to CI for stable screenshots
        run: |
          sed -i 's/^version:.*/version: CI/' smart_vent/config.yaml

      - name: Build Docker image
        run: docker build -t plenum:validate -t plenum-e2e .
        working-directory: smart_vent

      - name: Container smoke test
        run: |
          docker run -d --name validate-smoke \
            -p 8099:8099 \
            -e HA_URL=http://localhost:8123 \
            -e HA_TOKEN=dummy \
            plenum:validate

          echo "Polling /api/healthz..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/api/healthz || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ /api/healthz returned 200 after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ /api/healthz did not respond within 30s"
              docker logs validate-smoke
              docker stop validate-smoke
              docker rm validate-smoke
              exit 1
            fi
            sleep 1
          done

          docker logs validate-smoke
          docker stop validate-smoke
          docker rm validate-smoke

      # E2E visual regression — re-enabled after #182 (the isCI flag freezes
      # volatile UI). This is a read-only verify against the committed goldens;
      # golden regeneration lives only in e2e.yml. The `plenum-e2e` image built
      # above is reused by docker-compose.test.yml's plenum service.
      - name: Start Home Assistant (wait for healthy)
        run: docker compose -f docker-compose.test.yml up --wait homeassistant
        timeout-minutes: 10

      - name: Create HA token
        run: |
          pip install requests websocket-client --quiet
          python3 e2e/scripts/setup-ha.py \
            --ha-url http://localhost:8123 \
            --output /tmp/ha_token.txt

      - name: Start Plenum
        run: |
          HA_TOKEN=$(cat /tmp/ha_token.txt) \
          docker compose -f docker-compose.test.yml up -d plenum

      - name: Wait for Plenum health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/api/healthz -o /dev/null; then
              echo "Plenum is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Plenum did not become healthy within 90s" >&2
          docker compose -f docker-compose.test.yml logs plenum >&2
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E visual regression tests
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
        run: npx playwright test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-release-playwright-results
          path: e2e/test-results/
          retention-days: 14

      - name: Report versions
        run: |
          echo "## Release Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| pyproject.toml | $(grep '^version = ' smart_vent/pyproject.toml | sed 's/version = //' | tr -d '"') |" >> $GITHUB_STEP_SUMMARY
          echo "| package.json | $(node -p "require('./smart_vent/frontend/package.json').version") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks passed — this commit is releasable." >> $GITHUB_STEP_SUMMARY

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
