name: Build & Push Docker Image

# Triggers:
#   pull_request → main : build-only validation (no push, no credentials)
#   push → main         : build + push :latest and :<version from config.yaml>
#
# NOTE: v* tags no longer trigger this workflow directly. The release-pr.yml
# workflow handles tag events by creating a release PR. Once that PR is merged
# to main, this workflow publishes the versioned image.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------------------
  # PR validation: build only, no push, no GHCR credentials.
  # packages: write is intentionally absent — this job cannot push even if
  # the build step were misconfigured.
  # -----------------------------------------------------------------------
  build:
    name: Build (PR validation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./smart_vent
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # Main publish: build and push to GHCR.
  # Pushes two tags:
  #   :latest         — always, on every merge to main
  #   :<version>      — read from smart_vent/config.yaml (e.g. "0.4.0")
  # Only runs on pushes to main — never on pull_request events.
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Push (main release)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' smart_vent/config.yaml \
            | sed 's/version:[[:space:]]*//' \
            | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building image version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./smart_vent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
