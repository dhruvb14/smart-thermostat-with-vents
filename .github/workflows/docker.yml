name: Build & Push Docker Image

# Behaviour by trigger:
#
#   release/v* PR open/update → main
#     └─ Handled in container-ci.yml's "build" job, which builds the image ONCE
#        and pushes :<version> + :latest (and Trivy-scans it). That single image
#        is then reused by the smoke test and the °F/°C E2E legs. The old
#        build-release job lived here and built the image a SECOND time; it was
#        removed so a release PR builds once. See #337.
#
#   release/v* merged → main
#     └─ build-and-push is skipped (image was already published during the PR).
#
#   Any other PR open/update → main
#     └─ Dockerfile validation lives in container-ci.yml's "build" job
#        (build + push to a ci-<sha> tag, reused by smoke + E2E). See #333.
#
#   Any other branch merged → main
#     └─ build-and-push : BUILD + PUSH — only when smart_vent/config.yaml changed
#        (covers a version bump that lands outside the release/v* flow).
#
# This workflow therefore only does work on push-to-main now; all pull_request
# container work moved to container-ci.yml.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'e2e/screenshots/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------------------
  # Main push: only runs for non-release merges AND only if config.yaml
  # changed (i.e. a version bump landed outside the release PR flow).
  # Release PR merges are skipped entirely — the image was already pushed.
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Push (main — config changed)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # need HEAD^ to diff against

      - name: Check if this is a release PR merge
        id: branch-check
        run: |
          # The merge commit message for a release PR follows "Merge pull request #N from owner/release/vX.Y.Z"
          MERGE_MSG=$(git log -1 --pretty=%s)
          if echo "$MERGE_MSG" | grep -qE 'release/v[0-9]+\.[0-9]+\.[0-9]+';
           then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
            echo "Release PR merge detected — skipping build (image already published)"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if config.yaml changed
        id: config-check
        if: steps.branch-check.outputs.is_release_merge == 'false'
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q 'smart_vent/config.yaml'; then
            echo "config_changed=true" >> "$GITHUB_OUTPUT"
            echo "config.yaml changed — will build and push"
          else
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
            echo "config.yaml unchanged — skipping build"
          fi

      - name: Read version from config.yaml
        id: version
        if: |
          steps.branch-check.outputs.is_release_merge == 'false' &&
          steps.config-check.outputs.config_changed == 'true'
        run: |
          VERSION=$(grep '^version:' smart_vent/config.yaml \
            | sed 's/version:[[:space:]]*//' \
            | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building image version: ${VERSION}"

      - name: Set up QEMU
        if: |
          steps.branch-check.outputs.is_release_merge == 'false' &&
          steps.config-check.outputs.config_changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: |
          steps.branch-check.outputs.is_release_merge == 'false' &&
          steps.config-check.outputs.config_changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: |
          steps.branch-check.outputs.is_release_merge == 'false' &&
          steps.config-check.outputs.config_changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: |
          steps.branch-check.outputs.is_release_merge == 'false' &&
          steps.config-check.outputs.config_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./smart_vent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
