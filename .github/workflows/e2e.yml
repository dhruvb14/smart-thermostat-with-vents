name: E2E visual regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger — useful for regenerating goldens on demand

permissions:
  contents: write # needed to commit updated golden screenshots back to the PR branch

jobs:
  e2e:
    name: E2E visual regression (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch with a token so the bot can push back to the branch.
          # GITHUB_TOKEN is sufficient for same-repo branches; forks will
          # skip the commit step gracefully.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the addon image once and reuse it — avoids re-building inside compose
      - name: Build Plenum image
        run: docker build -t plenum-e2e ./smart_vent

      # Start HA (ha-init copies configuration.yaml first via depends_on) and
      # wait until the healthcheck passes. The HA image is ~1.5 GB; pulling it
      # in CI can take 60–120 s, so we use --wait and let Docker track liveness
      # rather than racing against a fixed poll timeout.
      - name: Start Home Assistant (wait for healthy)
        run: docker compose -f docker-compose.test.yml up --wait homeassistant
        timeout-minutes: 10

      # HA is now confirmed healthy. Create an admin user + long-lived token.
      - name: Create HA token
        run: |
          pip install requests websocket-client --quiet
          python3 e2e/scripts/setup-ha.py \
            --ha-url http://localhost:8123 \
            --output /tmp/ha_token.txt

      # Inject the token and start Plenum (it connects to HA on the Docker network)
      - name: Start Plenum
        run: |
          HA_TOKEN=$(cat /tmp/ha_token.txt) \
          docker compose -f docker-compose.test.yml up -d plenum

      - name: Wait for Plenum health
        run: |
          echo "Waiting for Plenum..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/api/healthz -o /dev/null; then
              echo "Plenum is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Plenum did not become healthy within 90s" >&2
          docker compose -f docker-compose.test.yml logs plenum >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Run tests with --update-snapshots so CI always generates canonical goldens
      # that match the Linux/Chromium environment. Any changed screenshots are
      # committed back to the PR branch so reviewers can inspect them in the diff.
      - name: Run E2E tests (regenerate goldens)
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
        run: npx playwright test --update-snapshots

      # Commit any new or updated golden screenshots back to the PR branch.
      # This is a no-op if nothing changed. The [skip ci] tag prevents a loop.
      #
      # We save the generated screenshots to /tmp before fetching the latest
      # remote state. This handles the case where new commits have been pushed
      # to the branch since CI checked out — a plain push would be rejected.
      - name: Commit updated golden screenshots
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add e2e/screenshots/
          if git diff --cached --quiet; then
            echo "No golden screenshot changes."
          else
            echo "Golden screenshots updated — committing to branch."
            BRANCH="${{ github.head_ref || github.ref_name }}"

            # Save CI-generated screenshots outside the repo
            cp -r e2e/screenshots /tmp/ci_screenshots

            # Rebase onto the current remote tip so our push is a fast-forward
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            # Restore the CI-generated screenshots and commit
            cp -r /tmp/ci_screenshots/. e2e/screenshots/
            git add e2e/screenshots/
            git diff --cached --quiet || git commit -m "ci: update E2E golden screenshots [skip ci]"
            git push origin "$BRANCH"
          fi

      # Always upload full test results so reviewers can inspect screenshots
      # even when tests pass (useful for manual golden review).
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
