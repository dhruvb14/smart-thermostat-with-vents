name: E2E visual regression

on:
  # Re-enabled after #182: the frontend isCI flag (VITE_APP_VERSION === "CI")
  # freezes all volatile UI — wall-clock strings, countdown timers, and the
  # engine-driven action/event/cycle feeds — so the update pass and verify pass
  # render identically.
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger — useful for regenerating goldens on demand

permissions:
  contents: write # commit updated golden screenshots back to the PR branch
  packages: read # pull container-ci's prebuilt image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # docker/* and actions/* still ship a Node 20 runtime; opt into Node 24 to
  # clear the deprecation warning (GitHub forces Node 24 by default now anyway).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    # Run the visual suite once per display unit so UI conversion regressions
    # (e.g. a setpoint rendering as 158 °F instead of 70 °F) are caught in both
    # directions. Goldens are unit-specific filenames (…-Fahrenheit-… vs
    # …-Celsius-…) via playwright.config.ts's PLENUM_TEMP_UNIT-driven template.
    name: E2E visual regression (${{ matrix.unit }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Serialize the legs: each commits its regenerated goldens back to the
      # branch, and two concurrent pushes to the same ref would race. The °C leg
      # checks out the °F leg's commit first, then adds its own Celsius files.
      max-parallel: 1
      matrix:
        unit: [F, C]

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch with a token so the bot can push back to the branch.
          # GITHUB_TOKEN is sufficient for same-repo branches; forks will
          # skip the commit step gracefully.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Decide where the addon image comes from. Same-repo PRs REUSE the image
      # container-ci already built and pushed for this commit instead of
      # rebuilding it here — that image already has the frozen UI baked in.
      # Two cases for same-repo PRs:
      #   • Normal PR  → container-ci pushed ghcr.io/<repo>:ci-<sha>
      #   • Release PR (release/v*) → container-ci pushed ghcr.io/<repo>:<version>
      #     (the real publish tag). The ci-<sha> tag is NEVER pushed for release
      #     PRs, so we must compute the version tag here or the poll loop below
      #     will wait the full timeout and then fail. (#338 edge-case)
      # Fork PRs (read-only token, no push) and manual workflow_dispatch runs
      # have no prebuilt image and fall back to building locally.
      - name: Decide image source
        id: src
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            REPO_LC=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
            case "${HEAD_REF}" in
              release/v*)
                # Release PRs: container-ci publishes :<version>, never ci-<sha>.
                VERSION=$(grep '^version:' smart_vent/config.yaml \
                  | sed 's/version:[[:space:]]*//' | tr -d '"')
                REF="${REPO_LC}:${VERSION}"
                ;;
              *)
                REF="${REPO_LC}:ci-${{ github.event.pull_request.head.sha }}"
                ;;
            esac
            echo "mode=pull" >> "$GITHUB_OUTPUT"
            echo "image=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      # ── Reuse path: pull container-ci's prebuilt image ──────────────────────
      - name: Log in to GitHub Container Registry
        if: steps.src.outputs.mode == 'pull'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt image (reuse container-ci build)
        if: steps.src.outputs.mode == 'pull'
        run: |
          IMG="${{ steps.src.outputs.image }}"
          # container-ci builds this image in a sibling workflow on the same
          # commit; wait for it to be pushed, then tag it as the compose default
          # (docker-compose.test.yml's plenum service uses plenum-e2e).
          # 80 × 30 s = 40 min ceiling — enough for a cold multi-arch build.
          for i in $(seq 1 80); do
            if docker pull "$IMG"; then
              docker tag "$IMG" plenum-e2e
              echo "Reusing prebuilt image $IMG"
              exit 0
            fi
            echo "Prebuilt image not available yet ($i/80); waiting for container-ci build…"
            sleep 30
          done
          echo "ERROR: prebuilt image $IMG never appeared — is the container-ci build failing?" >&2
          exit 1

      # ── Build path: fork PR / manual dispatch (no prebuilt image) ───────────
      - name: Set up Docker Buildx
        if: steps.src.outputs.mode == 'build'
        uses: docker/setup-buildx-action@v4

      - name: Set version to CI for stable screenshots
        if: steps.src.outputs.mode == 'build'
        run: |
          sed -i 's/^version:.*/version: CI/' smart_vent/config.yaml

      - name: Build Plenum image
        if: steps.src.outputs.mode == 'build'
        run: docker build -t plenum-e2e ./smart_vent

      # The °C leg layers the celsius override (TEMPERATURE_UNIT=C on plenum) on
      # top of the base compose file; the °F leg uses the base file alone.
      - name: Compose file list
        id: compose
        run: |
          if [ "${{ matrix.unit }}" = "C" ]; then
            echo "files=-f docker-compose.test.yml -f docker-compose.test.celsius.yml" >> "$GITHUB_OUTPUT"
          else
            echo "files=-f docker-compose.test.yml" >> "$GITHUB_OUTPUT"
          fi

      # Start HA (ha-init copies configuration.yaml first via depends_on) and
      # wait until the healthcheck passes. The HA image is ~1.5 GB; pulling it
      # in CI can take 60–120 s, so we use --wait and let Docker track liveness
      # rather than racing against a fixed poll timeout.
      - name: Start Home Assistant (wait for healthy)
        run: docker compose ${{ steps.compose.outputs.files }} up --wait homeassistant
        timeout-minutes: 10

      # HA is now confirmed healthy. Create an admin user + long-lived token.
      - name: Create HA token
        run: |
          pip install requests websocket-client --quiet
          python3 e2e/scripts/setup-ha.py \
            --ha-url http://localhost:8123 \
            --output /tmp/ha_token.txt

      # Inject the token and start Plenum (it connects to HA on the Docker network)
      - name: Start Plenum
        run: |
          HA_TOKEN=$(cat /tmp/ha_token.txt) \
          docker compose ${{ steps.compose.outputs.files }} up -d plenum

      - name: Wait for Plenum health
        run: |
          echo "Waiting for Plenum..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/api/healthz -o /dev/null; then
              echo "Plenum is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Plenum did not become healthy within 90s" >&2
          docker compose ${{ steps.compose.outputs.files }} logs plenum >&2
          exit 1

      - name: Verify active temperature unit matches matrix
        run: |
          UNIT=$(curl -sf http://localhost:8099/api/settings | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("temperature_unit","?"))')
          echo "Plenum reports temperature_unit=${UNIT}"
          if [ "${UNIT}" != "${{ matrix.unit }}" ]; then
            echo "ERROR: expected ${{ matrix.unit }}, got ${UNIT}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # First pass: run tests normally. If all screenshots match the committed
      # goldens for this unit, the job passes here and nothing is committed.
      - name: Run E2E tests
        id: run_tests
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        # Exclude the temperature-conversion round-trip: it mutates shared
        # backend state (creates schedules), so it can't run across two projects
        # or the update→verify double pass against one stack, and it's already
        # covered end-to-end by container-ci's conversion job (°F + °C). This
        # workflow is visual regression only.
        run: npx playwright test --grep-invert "Temperature round-trip"
        continue-on-error: true

      # Second pass: only reached when the first run failed. Regenerates screenshots
      # so they reflect the current Linux/Chromium rendering. If a test fails for a
      # non-screenshot reason (e.g. missing element), this step will also fail and
      # the job will report the real error — no spurious golden update in that case.
      - name: Regenerate golden screenshots on failure
        if: steps.run_tests.outcome == 'failure'
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        run: npx playwright test --update-snapshots --grep-invert "Temperature round-trip"

      # Commit only screenshots whose content actually changed (git compares by hash,
      # so files that were regenerated with identical bytes are silently ignored).
      # We save screenshots to /tmp then fetch the remote tip before pushing so
      # commits added since checkout (incl. the sibling unit leg) don't cause a
      # fast-forward rejection.
      #
      # Note: GITHUB_TOKEN pushes do not re-trigger workflow runs (GitHub's loop
      # prevention). Verification that the updated goldens pass is done in the
      # "Verify tests pass with updated goldens" step below, within the same run.
      - name: Commit changed goldens to branch
        if: steps.run_tests.outcome == 'failure'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Each leg owns ONLY its unit's goldens (…-Fahrenheit-… vs …-Celsius-…).
          # Staging the whole screenshots dir let a leg also commit its STALE copy
          # of the sibling unit's goldens, reverting whatever the sibling leg had
          # just regenerated — an endless cross-leg golden ping-pong. Restrict
          # every add/restore to this leg's unit so the legs can't clobber.
          UNIT_LABEL=$([ "${{ matrix.unit }}" = "C" ] && echo Celsius || echo Fahrenheit)
          git add -- "e2e/screenshots/*-${UNIT_LABEL}-*"
          if git diff --cached --quiet; then
            echo "No ${UNIT_LABEL} golden screenshot content changed."
          else
            CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
            echo "Updated goldens: $CHANGED"
            BRANCH="${{ github.head_ref || github.ref_name }}"
            cp -r e2e/screenshots /tmp/ci_screenshots
            git fetch origin "$BRANCH"
            # -f: the sibling unit leg may have advanced origin/$BRANCH since this
            # job checked out, and the regenerated goldens are a dirty working
            # tree — force the checkout (they're safe in /tmp and restored next).
            git checkout -f -B "$BRANCH" "origin/$BRANCH"
            # Restore ONLY this unit's regenerated goldens over the fetched tip;
            # the sibling unit's goldens stay exactly as origin has them.
            cp /tmp/ci_screenshots/*-"${UNIT_LABEL}"-* e2e/screenshots/ 2>/dev/null || true
            git add -- "e2e/screenshots/*-${UNIT_LABEL}-*"
            git diff --cached --quiet || git commit -m "ci: update E2E golden screenshots (${{ matrix.unit }})"
            git push origin "$BRANCH"
          fi

      # If the first run failed, goldens were updated and pushed above.
      # Re-run tests against the freshly regenerated goldens to verify
      # the failures were screenshot-only (expected diff). If a test
      # fails here for a non-screenshot reason (missing element, timeout),
      # this step will also fail and surface the real error.
      - name: Verify tests pass with updated goldens
        if: steps.run_tests.outcome == 'failure'
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        run: npx playwright test --grep-invert "Temperature round-trip"

      # Upload test results only on failure so reviewers can inspect diffs when
      # a test fails for a non-screenshot reason (e.g. missing element, timeout).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.unit }}
          path: e2e/test-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose ${{ steps.compose.outputs.files }} down -v
