name: Create Release PR

# Triggered when a semver tag is pushed (e.g. git tag v0.4.0 && git push --tags).
# This workflow:
#   1. Derives the version from the tag
#   2. Finds the previous release tag to bound the changelog range
#   3. Generates changelog bullets from merged PRs in that range
#   4. Lists unique contributors for the range
#   5. Prepends a new section to CHANGELOG.md
#   6. Bumps version in smart_vent/config.yaml
#   7. Opens a PR "Release vX.Y.Z" → main for review
#   8. Populates the GitHub Release notes for the tag (retried on failure)
#
# Can also be run manually (workflow_dispatch) with a `tag` input to resync
# just step 8 for an existing release, in case it failed after the release PR
# already merged (this happened for v0.32.0: a transient GitHub API 5xx on
# `gh release edit` left the release page blank even though PR #502 had the
# real notes). The resync path skips changelog/version-bump/branch/PR
# generation entirely and reuses the body of the already-merged
# "Release vX.Y.Z" PR verbatim.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to resync GitHub Release notes for (e.g.
          v0.32.0). Only touches the GitHub Release object — does not
          regenerate CHANGELOG.md, bump versions, or reopen the release PR.
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch full history and all tags so git log ranges work correctly
          fetch-depth: 0

      - name: Derive version and previous tag
        id: versions
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${DISPATCH_TAG}"                       # e.g. v0.32.0, resync-only
          else
            TAG="${GITHUB_REF_NAME}"                    # e.g. v0.4.0
          fi
          VERSION="${TAG#v}"                            # e.g. 0.4.0
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "workflow_dispatch resync for ${TAG} — skipping changelog/PR generation"
            exit 0
          fi

          # Find the most recent tag that is strictly older than this one
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            # No previous tag — use the initial commit
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "prev_is_sha=true" >> "$GITHUB_OUTPUT"
          else
            echo "prev_is_sha=false" >> "$GITHUB_OUTPUT"
          fi
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Previous boundary: ${PREV_TAG}"

      - name: Generate changelog entries
        if: github.event_name == 'push'
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.versions.outputs.prev_tag }}
          VERSION: ${{ steps.versions.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # --- Collect PR numbers from commit messages in range ---
          PR_NUMS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" \
            | grep -oE '#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un)

          echo "PRs found: ${PR_NUMS}"

          # --- Build bullet list from PR titles ---
          BULLETS=""
          for NUM in $PR_NUMS; do
            # Try to fetch PR info; skip if it's actually an issue number (no PR)
            PR_JSON=$(gh pr view "$NUM" --repo "$REPO" \
              --json number,title,url,closingIssuesReferences 2>/dev/null || echo "")
            if [ -z "$PR_JSON" ]; then
              continue
            fi

            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')

            # Skip release-automation PRs — they are housekeeping, not user-facing changes
            if echo "$PR_TITLE" | grep -qE '^Release v[0-9]'; then
              continue
            fi
            PR_URL=$(echo "$PR_JSON" | jq -r '.url')
            PR_NUM=$(echo "$PR_JSON" | jq -r '.number')

            # Build issue links from closing references
            ISSUE_LINKS=""
            ISSUE_REFS=$(echo "$PR_JSON" | jq -r '.closingIssuesReferences[]?.number' 2>/dev/null || echo "")
            for INUM in $ISSUE_REFS; do
              ISSUE_URL="https://github.com/${REPO}/issues/${INUM}"
              if [ -n "$ISSUE_LINKS" ]; then
                ISSUE_LINKS="${ISSUE_LINKS}, [#${INUM}](${ISSUE_URL})"
              else
                ISSUE_LINKS="[#${INUM}](${ISSUE_URL})"
              fi
            done

            if [ -n "$ISSUE_LINKS" ]; then
              BULLETS="${BULLETS}- ${PR_TITLE} (${ISSUE_LINKS}, [#${PR_NUM}](${PR_URL}))\n"
            else
              BULLETS="${BULLETS}- ${PR_TITLE} ([#${PR_NUM}](${PR_URL}))\n"
            fi
          done

          # Fallback if no PRs were found
          if [ -z "$BULLETS" ]; then
            BULLETS="- Miscellaneous improvements and fixes\n"
          fi

          # --- Collect unique contributors ---
          CONTRIBUTORS=$(git log "${PREV_TAG}..HEAD" --format='%aN' \
            | sort -u \
            | while read -r name; do
                EMAIL=$(git log "${PREV_TAG}..HEAD" --author="$name" \
                  --format='%aE' | head -1)
                GH_USER=""
                # Skip bot/noreply emails — they always fail the Search API
                if ! echo "$EMAIL" | grep -qE '(noreply\.github\.com|github-actions)'; then
                  # Gate on exit code so a 4xx error body never leaks into GH_USER
                  if RAW=$(gh api "search/users?q=${EMAIL}+in:email" 2>/dev/null); then
                    GH_USER=$(echo "$RAW" | jq -r '.items[0].login // empty' 2>/dev/null || true)
                  fi
                fi
                if [ -n "$GH_USER" ]; then
                  echo "- [@${GH_USER}](https://github.com/${GH_USER})"
                else
                  echo "- ${name}"
                fi
              done)

          if [ -z "$CONTRIBUTORS" ]; then
            CONTRIBUTORS="- @${GITHUB_ACTOR}"
          fi

          # --- Write to files for next steps (avoid env size limits) ---
          printf '%b' "$BULLETS" > /tmp/bullets.txt
          printf '%s' "$CONTRIBUTORS" > /tmp/contributors.txt

          # Also capture for PR body
          echo "bullets_file=/tmp/bullets.txt" >> "$GITHUB_OUTPUT"
          echo "contributors_file=/tmp/contributors.txt" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          BULLETS=$(cat /tmp/bullets.txt)
          CONTRIBUTORS=$(cat /tmp/contributors.txt)
          DATE=$(date +%Y-%m-%d)

          NEW_SECTION="## ${VERSION}\n\n### Added\n\n${BULLETS}\n### Contributors\n\n${CONTRIBUTORS}\n\n---\n\n"

          # Prepend new section after the H1 title line
          awk -v section="$NEW_SECTION" '
            /^# Changelog/ { print; print ""; printf "%s", section; next }
            { print }
          ' smart_vent/CHANGELOG.md > /tmp/CHANGELOG_new.md

          mv /tmp/CHANGELOG_new.md smart_vent/CHANGELOG.md

      - name: Bump version in config.yaml, pyproject.toml, and package.json
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          sed -i "s/^version: \".*\"/version: \"${VERSION}\"/" smart_vent/config.yaml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" smart_vent/pyproject.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" smart_vent/frontend/package.json
          npm install --package-lock-only --prefix smart_vent/frontend

      - name: Create release branch, commit, and push
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.versions.outputs.tag }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          git add smart_vent/CHANGELOG.md smart_vent/config.yaml smart_vent/pyproject.toml smart_vent/frontend/package.json smart_vent/frontend/package-lock.json
          git commit -m "chore: release ${TAG} — bump version and update changelog"
          git push origin "$BRANCH" --force

      - name: Open Pull Request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versions.outputs.tag }}
          VERSION: ${{ steps.versions.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="release/${TAG}"

          # Build PR body into a temp file to avoid multi-line YAML string issues
          {
            printf "## Release %s\n\n" "${TAG}"
            printf "This PR was automatically generated by the release workflow.\n\n"
            printf "### What's new in %s\n\n" "${VERSION}"
            cat /tmp/bullets.txt
            printf "\n### Contributors\n\n"
            cat /tmp/contributors.txt
            printf "\n---\n\n"
            printf "**Merging this PR will:**\n"
            printf -- "- Publish \`ghcr.io/%s:%s\` and \`ghcr.io/%s:latest\` to the GitHub Container Registry\n" "${REPO}" "${VERSION}" "${REPO}"
            printf -- "- Make the new version available to Home Assistant Supervisor\n"
          } > /tmp/pr_body.md

          gh pr create \
            --repo "$REPO" \
            --title "Release ${TAG}" \
            --body-file /tmp/pr_body.md \
            --head "$BRANCH" \
            --base main

      - name: Fetch existing release PR body (resync path)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versions.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(gh pr list --repo "$REPO" --state all --head "release/${TAG}" \
            --json body --jq '.[0].body // empty')
          if [ -z "$BODY" ]; then
            echo "::error::No 'release/${TAG}' PR found to resync notes from."
            exit 1
          fi
          printf '%s' "$BODY" > /tmp/pr_body.md

      - name: Populate GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versions.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # gh release edit occasionally hits a transient GitHub API 5xx
          # (this is exactly what left v0.32.0's release page blank even
          # though its release PR had the real notes). Retry with backoff
          # instead of failing the whole job on one hiccup.
          for attempt in 1 2 3 4 5; do
            if gh release edit "${TAG}" \
              --repo "$REPO" \
              --title "Plenum ${TAG}" \
              --notes-file /tmp/pr_body.md; then
              exit 0
            fi
            echo "Attempt ${attempt} failed to update release notes for ${TAG}; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to populate GitHub Release notes for ${TAG} after 5 attempts."
          exit 1
