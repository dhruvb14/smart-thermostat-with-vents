name: Container CI

# Single source of truth for the per-PR container pipeline. Builds the addon
# image ONCE and reuses it for the smoke test, the temperature-conversion E2E
# legs (F / C), and the visual-regression E2E legs instead of each rebuilding
# it. Previously the same image was built ~4× per PR (build-pr + smoke + E2E
# F + E2E C).
#
# The `build` job has three modes, decided at runtime:
#
#   • Normal same-repo PR
#       → multi-arch build, push ghcr.io/<repo>:ci-<sha> (throwaway).
#         Downstream jobs PULL it.
#
#   • Release PR (head branch like release/v0.17.0)
#       → multi-arch build, push the REAL ghcr.io/<repo>:<version> + :latest,
#         then Trivy-scan it. Downstream jobs PULL the explicit :<version> tag
#         (never :latest, so tests run against exactly the artifact being
#         published). This replaces docker.yml's old build-release job — a
#         release PR now builds the image ONCE instead of twice. See #337.
#
#   • Fork PR / workflow_dispatch
#       → fork tokens are read-only and cannot push to GHCR, so build
#         single-arch, `docker save` to an artifact; downstream jobs
#         download + `docker load` it (tagged plenum-e2e). See #337.
#         workflow_dispatch also uses this path (no PR, so HEAD_REPO is empty).
#
# Cross-job reuse needs `needs:` (same workflow), which is why the smoke test
# (was lint.yml), the conversion matrix (was e2e-conversion.yml), and the
# visual-regression matrix (was e2e.yml) live here alongside the build.
# Issues #330, #331, #332, #333 and #334 follow-ups (#337).

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger — useful for regenerating golden screenshots on demand

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the same PR. Besides
# saving CI minutes, this stops two concurrent runs of this workflow from racing
# to reserve the same buildx/qemu (binfmt) GHA cache key — the "another job may
# be creating this cache" warning seen when commits are pushed back-to-back.
concurrency:
  group: container-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # docker/build-push-action@v6 (and the other docker/* actions) still ship a
  # Node.js 20 runtime, which GitHub has deprecated. Opt every JS action in this
  # workflow into the Node.js 24 runtime to clear the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -----------------------------------------------------------------------
  # Classify the diff so docs-only PRs skip the expensive container jobs
  # (#412). This MUST stay a job-level `if:` gate, never a workflow-level
  # `paths:` filter: a job skipped by `if:` still reports "skipped" (which
  # satisfies branch protection), while a path-filtered workflow never
  # creates its required check and the PR hangs forever. Replacing the old
  # `paths-ignore: e2e/screenshots/**` here also retires the goldens-only
  # stuck-PR trap; the golden-bot loop protection is independently
  # guaranteed by GITHUB_TOKEN pushes not re-triggering workflows.
  # -----------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # merge-base diff against the PR base

      - name: Classify diff (code vs docs-only)
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "${BASE_SHA}" ]; then
            # workflow_dispatch has no PR diff — run everything (this is the
            # manual golden-regeneration path).
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${BASE_SHA}...HEAD" > /tmp/changed.txt
          echo "Changed files:"
          cat /tmp/changed.txt
          # Docs-only: markdown anywhere, docs/, .claude/ (skills), the README
          # screenshots dir, and committed golden PNGs. Anything else = code.
          if grep -vE '^(docs/|\.claude/|screenshots/|e2e/screenshots/)|\.md$' /tmp/changed.txt | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only diff — container jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # -----------------------------------------------------------------------
  # Build the image once. Mode (ci-<sha> / release :<version> / fork artifact)
  # is decided by the `meta` step. This is the required "Build (PR validation)"
  # check — for a release PR it is also the publish + vulnerability scan that
  # used to live in docker.yml's build-release job.
  # -----------------------------------------------------------------------
  build:
    name: Build (PR validation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload (release PRs only)
    outputs:
      image: ${{ steps.meta.outputs.image }}
      is_fork: ${{ steps.meta.outputs.is_fork }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute build mode and image ref
        id: meta
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fork? A fork's head repo differs from this repo, and its GITHUB_TOKEN
          # is read-only — it cannot push to GHCR.
          if [ "${HEAD_REPO}" != "${IMAGE_NAME}" ]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

          # Release PR? The release workflow opens it from a release/vX.Y.Z branch
          # and has already bumped smart_vent/config.yaml to the numeric version.
          # Fork takes precedence: a fork can't push to GHCR, so even a fork PR
          # named release/v* uses the artifact-handoff path, never the publish
          # path (otherwise both build steps would fire and the push would fail).
          case "${HEAD_REF}" in
            release/v*) IS_RELEASE=true ;;
            *) IS_RELEASE=false ;;
          esac
          if [ "${HEAD_REPO}" != "${IMAGE_NAME}" ]; then
            IS_RELEASE=false
          fi
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

          REPO_LC=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "latest_image=${REPO_LC}:latest" >> "$GITHUB_OUTPUT"
          if [ "${IS_RELEASE}" = "true" ]; then
            VERSION=$(grep '^version:' smart_vent/config.yaml \
              | sed 's/version:[[:space:]]*//' | tr -d '"')
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "image=${REPO_LC}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${REPO_LC}:ci-${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin addon version for deterministic UI
        # Non-release PRs pin to "CI" so screenshots/UI are deterministic. Release
        # PRs MUST keep the real version so the *published* image shows v<version> —
        # that image is built first, below, from the unmodified config.yaml.
        if: steps.meta.outputs.is_release != 'true'
        run: |
          sed -i 's/^version:.*/version: CI/' smart_vent/config.yaml

      - name: Set up QEMU
        # Only the RELEASE build is multi-arch (#413) — normal-PR ci-* images
        # are amd64-only throwaways, so the (slow, emulated) arm64 leg and its
        # QEMU setup are skipped entirely off the critical path.
        if: steps.meta.outputs.is_release == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.is_fork != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Release PR (same-repo): publish the real version tags ───────────────
      - name: Build and push release image (multi-arch)
        if: steps.meta.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./smart_vent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Normal same-repo PR: throwaway ci-<sha> tag ─────────────────────────
      # amd64-only (#413): every downstream consumer — smoke, both round-trip
      # legs, both visual legs — runs on amd64 ubuntu-latest, and the tag is
      # pruned nightly. The QEMU-emulated arm64 half was never pulled by
      # anything and sat on the critical path of all six downstream jobs
      # (2m49s measured WITH a warm cache; far worse cold). Multi-arch remains
      # exclusively for the published release image above.
      - name: Build and push CI image (amd64)
        if: steps.meta.outputs.is_release != 'true' && steps.meta.outputs.is_fork != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./smart_vent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Release PR only: pin config.yaml to "CI" *after* the real image above
      # has already been built and pushed. The published image must bake the
      # real version (VITE_APP_VERSION drives the footer AND the frontend's
      # `isCI` determinism flag — see frontend/src/ci.tsx), so it can't also be
      # the image the visual-regression job screenshots: without `isCI`, pages
      # with live/engine-driven content (device uptime, event feeds) render
      # differently on every capture and can never match a committed golden.
      # This mutates config.yaml on disk for the *next* build only; it has no
      # effect on the release image already pushed above.
      - name: Pin addon version to CI for the release PR's test-only image
        if: steps.meta.outputs.is_release == 'true'
        run: |
          sed -i 's/^version:.*/version: CI/' smart_vent/config.yaml

      # ── Fork PR, or release PR needing a frozen-UI test image: can't/shouldn't
      # push; build single-arch and hand off via artifact. `load: true` only
      # supports a single platform, which is fine: CI runners are amd64 and
      # neither case needs the arm64 variant (that exists only so the pushed
      # release tag is locally pullable on Apple Silicon — see #332).
      - name: Build fork/frozen-UI image (single-arch, load)
        if: steps.meta.outputs.is_fork == 'true' || steps.meta.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./smart_vent
          platforms: linux/amd64
          push: false
          load: true
          tags: plenum-e2e:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save fork/frozen-UI image to artifact
        if: steps.meta.outputs.is_fork == 'true' || steps.meta.outputs.is_release == 'true'
        run: docker save plenum-e2e:latest -o /tmp/plenum-image.tar

      - name: Upload fork/frozen-UI image artifact
        if: steps.meta.outputs.is_fork == 'true' || steps.meta.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plenum-image
          path: /tmp/plenum-image.tar
          retention-days: 1

      # ── Release PR: vulnerability scan of the published image ───────────────
      # (Moved from docker.yml's build-release job so a release PR builds once.)
      - name: Run Trivy vulnerability scan on release image
        if: steps.meta.outputs.is_release == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: "table"
          output: "trivy-report.txt"
          trivyignores: ".trivyignore"

      - name: Parse Trivy results for critical vulnerabilities
        if: steps.meta.outputs.is_release == 'true'
        run: |
          # Match "CRITICAL: N" where N >= 1 — avoids false positives from
          # summary lines like "CRITICAL: 0" that appear even when clean.
          if grep -qE 'CRITICAL: [1-9]' trivy-report.txt; then
            echo "❌ CRITICAL vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Display full Trivy report in summary
        if: always() && steps.meta.outputs.is_release == 'true'
        run: |
          echo "## Container Image Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy SARIF for GitHub Security tab
        if: steps.meta.outputs.is_release == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: "sarif"
          output: "trivy-results.sarif"
          trivyignores: ".trivyignore"

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.meta.outputs.is_release == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  # -----------------------------------------------------------------------
  # Smoke test: obtain the prebuilt image and confirm /api/healthz serves.
  # Same-repo PRs pull the pushed tag; fork PRs load the saved artifact.
  # (Was lint.yml → docker-smoke-test; same check name.)
  # -----------------------------------------------------------------------
  smoke:
    name: Docker Smoke Test
    needs: [build, changes]
    # Skipped (not absent) on docs-only PRs — a skipped job still reports its
    # check, so branch protection cannot hang (#412).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download fork image artifact
        if: needs.build.outputs.is_fork == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plenum-image
          path: /tmp

      - name: Load fork image
        if: needs.build.outputs.is_fork == 'true'
        run: docker load -i /tmp/plenum-image.tar

      - name: Log in to GitHub Container Registry
        if: needs.build.outputs.is_fork != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt image
        if: needs.build.outputs.is_fork != 'true'
        run: docker pull ${{ needs.build.outputs.image }}

      - name: Resolve image ref
        id: img
        run: |
          if [ "${{ needs.build.outputs.is_fork }}" = "true" ]; then
            echo "ref=plenum-e2e:latest" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ needs.build.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Container Smoke Test
        run: |
          # HA_URL/HA_TOKEN are dummies — the HTTP server binds before the HA
          # client connects, so healthz is reachable without a real HA instance.
          # Publish both the web-UI port (8099) and the MCP port (9099) so we
          # can prove a real MCP client can connect against the built image.
          docker run -d --name smoke-test \
            -p 8099:8099 \
            -p 9099:9099 \
            -e HA_URL=http://localhost:8123 \
            -e HA_TOKEN=dummy \
            -e TIMEZONE=America/New_York \
            -e TEMPERATURE_UNIT=F \
            ${{ steps.img.outputs.ref }}

          echo "Waiting for /api/healthz to respond..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/api/healthz || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ /api/healthz returned 200 after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ /api/healthz did not respond within 30s"
              docker logs smoke-test
              docker stop smoke-test
              exit 1
            fi
            sleep 1
          done

          # ----- Static public/ asset: apple-touch-icon.png ----------------
          # Vite's public/ dir is copied to the dist root, not under /assets,
          # so the SPA fallback route must serve it as a real file. Without
          # that handling it silently 200s with the index.html shell instead
          # (wrong content-type, so Safari's "Add to Home Screen" icon never
          # loads) — assert on content-type, not just status, to catch that.
          echo "Verifying the home-screen icon is served as a real file..."
          ICON_CONTENT_TYPE=$(curl -sI http://localhost:8099/apple-touch-icon.png | tr -d '\r' | grep -i '^content-type:' | cut -d' ' -f2)
          if [ "$ICON_CONTENT_TYPE" = "image/png" ]; then
            echo "✅ /apple-touch-icon.png served as image/png"
          else
            echo "❌ /apple-touch-icon.png did not serve as image/png (got content-type: $ICON_CONTENT_TYPE)"
            docker logs smoke-test; docker stop smoke-test; exit 1
          fi

          # ----- MCP server: spin-up + consumer connection -----------------
          # The MCP endpoint (Streamable HTTP on :9099/mcp) is gated by the
          # mcp_enabled toggle, which defaults OFF. First prove the gate, then
          # enable it via the REST API and connect a real MCP client.
          MCP_INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
          MCP_HDRS=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')

          echo "Verifying MCP is gated off by default..."
          for i in $(seq 1 15); do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" -X POST http://localhost:9099/mcp "${MCP_HDRS[@]}" -d "$MCP_INIT" || true)
            [ "$CODE" = "503" ] && { echo "✅ MCP returns 503 while disabled"; break; }
            # 000 = port not accepting connections yet; keep waiting.
            if [ "$i" = "15" ]; then
              echo "❌ expected 503 from disabled MCP, last code: $CODE"
              docker logs smoke-test; docker stop smoke-test; exit 1
            fi
            sleep 1
          done

          echo "Enabling the MCP server via the REST API..."
          curl -sf -X POST http://localhost:8099/api/system/mcp \
            -H 'Content-Type: application/json' -d '{"mcp_enabled":true}' > /dev/null

          echo "Connecting an MCP client (initialize)..."
          MCP_OK=0
          for i in $(seq 1 15); do
            INIT=$(curl -sL -X POST http://localhost:9099/mcp "${MCP_HDRS[@]}" -d "$MCP_INIT" || true)
            if echo "$INIT" | grep -q '"serverInfo"'; then
              echo "✅ MCP initialize succeeded: $(echo "$INIT" | grep -o '"serverInfo":{[^}]*}')"
              MCP_OK=1; break
            fi
            sleep 1
          done
          if [ "$MCP_OK" != "1" ]; then
            echo "❌ MCP client could not initialize against :9099/mcp"
            docker logs smoke-test; docker stop smoke-test; exit 1
          fi

          echo "Listing MCP tools..."
          TOOLS=$(curl -sL -X POST http://localhost:9099/mcp "${MCP_HDRS[@]}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' || true)
          if echo "$TOOLS" | grep -q '"get_healthz"'; then
            echo "✅ MCP tools/list returned the generated tool surface"
          else
            echo "❌ MCP tools/list did not return the expected tools"
            echo "$TOOLS" | head -c 500
            docker logs smoke-test; docker stop smoke-test; exit 1
          fi

          docker logs smoke-test
          docker stop smoke-test
          echo "Smoke test passed!"

  # -----------------------------------------------------------------------
  # Temperature-conversion round-trip under both °F and °C. Each leg reuses
  # the single prebuilt image (pull for same-repo PRs, load-from-artifact for
  # forks) instead of rebuilding. (Was e2e-conversion.yml; same check names.)
  # -----------------------------------------------------------------------
  conversion:
    name: Round-trip (${{ matrix.unit }})
    needs: [build, changes]
    # Skipped (not absent) on docs-only PRs — a skipped job still reports its
    # check, so branch protection cannot hang (#412).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        unit: [F, C]
    steps:
      - uses: actions/checkout@v6

      - name: Download fork image artifact
        if: needs.build.outputs.is_fork == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plenum-image
          path: /tmp

      - name: Load fork image
        if: needs.build.outputs.is_fork == 'true'
        run: docker load -i /tmp/plenum-image.tar

      - name: Log in to GitHub Container Registry
        if: needs.build.outputs.is_fork != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt image
        if: needs.build.outputs.is_fork != 'true'
        run: docker pull "${{ needs.build.outputs.image }}"

      - name: Resolve PLENUM_IMAGE for compose
        run: |
          # docker-compose.test.yml's plenum service uses ${PLENUM_IMAGE:-plenum-e2e}.
          # Same-repo: point it at the pulled tag. Fork: the loaded image is
          # already tagged plenum-e2e (the compose default), so use that.
          if [ "${{ needs.build.outputs.is_fork }}" = "true" ]; then
            echo "PLENUM_IMAGE=plenum-e2e" >> "$GITHUB_ENV"
          else
            echo "PLENUM_IMAGE=${{ needs.build.outputs.image }}" >> "$GITHUB_ENV"
          fi

      - name: Compose file list
        id: compose
        run: |
          if [ "${{ matrix.unit }}" = "C" ]; then
            echo "files=-f docker-compose.test.yml -f docker-compose.test.celsius.yml" >> "$GITHUB_OUTPUT"
          else
            echo "files=-f docker-compose.test.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Home Assistant (wait for healthy)
        run: docker compose ${{ steps.compose.outputs.files }} up --wait homeassistant
        timeout-minutes: 10

      - name: Create HA token
        run: |
          pip install requests websocket-client --quiet
          python3 e2e/scripts/setup-ha.py \
            --ha-url http://localhost:8123 \
            --output /tmp/ha_token.txt

      - name: Start Plenum (reuse prebuilt image)
        run: |
          HA_TOKEN=$(cat /tmp/ha_token.txt) \
          docker compose ${{ steps.compose.outputs.files }} up -d plenum

      - name: Wait for Plenum health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/api/healthz -o /dev/null; then
              echo "Plenum is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Plenum did not become healthy within 90s" >&2
          docker compose ${{ steps.compose.outputs.files }} logs plenum >&2
          exit 1

      - name: Verify active temperature unit matches matrix
        run: |
          UNIT=$(curl -sf http://localhost:8099/api/settings | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("temperature_unit","?"))')
          echo "Plenum reports temperature_unit=${UNIT}"
          if [ "${UNIT}" != "${{ matrix.unit }}" ]; then
            echo "ERROR: expected ${{ matrix.unit }}, got ${UNIT}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          # The lockfile, not package.json (#414): npm ci resolves from the
          # lock, so keying the cache on package.json reused stale caches on
          # lockfile-only bumps and busted them on no-op manifest edits.
          cache-dependency-path: e2e/package-lock.json

      # Cache the Playwright browser download (#414) — it was re-fetched in
      # every E2E-family leg on every push. --with-deps apt packages are not
      # cacheable and still install each run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run temperature round-trip tests
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        run: npx playwright test temperature-units.spec.ts --project=chromium

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.unit }}
          path: e2e/test-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose ${{ steps.compose.outputs.files }} down -v

  # -----------------------------------------------------------------------
  # Visual regression: screenshot every page against committed golden PNGs
  # and fail on any pixel deviation. Moved from e2e.yml so it can declare
  # `needs: build` and pull the prebuilt image directly — no polling loop.
  #
  # Both matrix legs run in parallel. When goldens need updating, each leg
  # uploads only its own unit's regenerated PNGs as a GitHub Actions artifact
  # (goldens-F / goldens-C). The fan-in `commit-goldens` job waits for both
  # legs, downloads all artifacts, and makes a single combined commit — no
  # more two-commit double-CI-trigger or max-parallel serialisation.
  # -----------------------------------------------------------------------
  e2e:
    name: E2E visual regression (${{ matrix.unit }})
    needs: [build, changes]
    # Skipped (not absent) on docs-only PRs — a skipped job still reports its
    # check, so branch protection cannot hang (#412).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read  # read-only: commits happen in the fan-in commit-goldens job
      packages: read  # pull container-ci's prebuilt image
    strategy:
      fail-fast: false
      matrix:
        unit: [F, C]

    steps:
      - uses: actions/checkout@v6

      # ── Reuse path: same-repo, non-release PRs pull the pushed ci-<sha> tag.
      # Release PRs do NOT take this path even though they're same-repo: the
      # published :<version> tag bakes the real VITE_APP_VERSION, so its UI
      # isn't `isCI`-frozen and can never match a committed golden (frozen vs.
      # live device-uptime/event-feed content). They use the artifact path
      # below instead, same as forks.
      - name: Log in to GitHub Container Registry
        if: needs.build.outputs.is_fork != 'true' && needs.build.outputs.is_release != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt image (reuse container-ci build)
        if: needs.build.outputs.is_fork != 'true' && needs.build.outputs.is_release != 'true'
        run: |
          docker pull "${{ needs.build.outputs.image }}"
          docker tag "${{ needs.build.outputs.image }}" plenum-e2e
          echo "Reusing prebuilt image ${{ needs.build.outputs.image }}"

      # ── Fork / workflow_dispatch / release PR: load from saved artifact.
      # For a release PR this is the frozen-UI throwaway image the build job
      # built specifically for this job (see container-ci's build job) — not
      # the published :<version> image.
      - name: Download fork/frozen-UI image artifact
        if: needs.build.outputs.is_fork == 'true' || needs.build.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plenum-image
          path: /tmp

      - name: Load fork/frozen-UI image
        if: needs.build.outputs.is_fork == 'true' || needs.build.outputs.is_release == 'true'
        run: docker load -i /tmp/plenum-image.tar

      - name: Resolve PLENUM_IMAGE for compose
        run: |
          if [ "${{ needs.build.outputs.is_fork }}" = "true" ] || [ "${{ needs.build.outputs.is_release }}" = "true" ]; then
            echo "PLENUM_IMAGE=plenum-e2e" >> "$GITHUB_ENV"
          else
            echo "PLENUM_IMAGE=${{ needs.build.outputs.image }}" >> "$GITHUB_ENV"
          fi

      # The °C leg layers the celsius override (TEMPERATURE_UNIT=C on plenum)
      # on top of the base compose file; the °F leg uses the base file alone.
      - name: Compose file list
        id: compose
        run: |
          if [ "${{ matrix.unit }}" = "C" ]; then
            echo "files=-f docker-compose.test.yml -f docker-compose.test.celsius.yml" >> "$GITHUB_OUTPUT"
          else
            echo "files=-f docker-compose.test.yml" >> "$GITHUB_OUTPUT"
          fi

      # Start HA (ha-init copies configuration.yaml first via depends_on) and
      # wait until the healthcheck passes. The HA image is ~1.5 GB; pulling it
      # in CI can take 60–120 s, so we use --wait and let Docker track liveness
      # rather than racing against a fixed poll timeout.
      - name: Start Home Assistant (wait for healthy)
        run: docker compose ${{ steps.compose.outputs.files }} up --wait homeassistant
        timeout-minutes: 10

      # HA is now confirmed healthy. Create an admin user + long-lived token.
      - name: Create HA token
        run: |
          pip install requests websocket-client --quiet
          python3 e2e/scripts/setup-ha.py \
            --ha-url http://localhost:8123 \
            --output /tmp/ha_token.txt

      # Inject the token and start Plenum (it connects to HA on the Docker network)
      - name: Start Plenum
        run: |
          HA_TOKEN=$(cat /tmp/ha_token.txt) \
          docker compose ${{ steps.compose.outputs.files }} up -d plenum

      - name: Wait for Plenum health
        run: |
          echo "Waiting for Plenum..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8099/api/healthz -o /dev/null; then
              echo "Plenum is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Plenum did not become healthy within 90s" >&2
          docker compose ${{ steps.compose.outputs.files }} logs plenum >&2
          exit 1

      - name: Verify active temperature unit matches matrix
        run: |
          UNIT=$(curl -sf http://localhost:8099/api/settings | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("temperature_unit","?"))')
          echo "Plenum reports temperature_unit=${UNIT}"
          if [ "${UNIT}" != "${{ matrix.unit }}" ]; then
            echo "ERROR: expected ${{ matrix.unit }}, got ${UNIT}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          # The lockfile, not package.json (#414): npm ci resolves from the
          # lock, so keying the cache on package.json reused stale caches on
          # lockfile-only bumps and busted them on no-op manifest edits.
          cache-dependency-path: e2e/package-lock.json

      # Cache the Playwright browser download (#414) — it was re-fetched in
      # every E2E-family leg on every push. --with-deps apt packages are not
      # cacheable and still install each run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # First pass: run tests normally. If all screenshots match the committed
      # goldens for this unit, the job passes here and nothing is committed.
      - name: Run E2E tests
        id: run_tests
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        # Exclude the temperature-conversion round-trip: it mutates shared
        # backend state (creates schedules), so it can't run across two
        # projects (chromium + mobile) or the update→verify double pass against
        # one stack. It's covered by the conversion job above.
        run: npx playwright test --grep-invert "Temperature round-trip"
        continue-on-error: true

      # Second pass: only reached when the first run failed. Regenerates
      # screenshots so they reflect the current Linux/Chromium rendering. If a
      # test fails for a non-screenshot reason (e.g. missing element), this
      # step will also fail — no spurious golden update in that case.
      - name: Regenerate golden screenshots on failure
        if: steps.run_tests.outcome == 'failure'
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        run: npx playwright test --update-snapshots --grep-invert "Temperature round-trip"

      # Verify that the regenerated goldens actually fix the failures before
      # we hand them off to the commit-goldens fan-in. If tests fail here for
      # a non-screenshot reason (missing element, timeout), this step also
      # fails — no artifact is uploaded and the real error surfaces.
      - name: Verify tests pass with updated goldens
        id: verify
        if: steps.run_tests.outcome == 'failure'
        working-directory: e2e
        env:
          PLENUM_URL: "http://localhost:8099"
          PLENUM_TEMP_UNIT: ${{ matrix.unit }}
        run: npx playwright test --grep-invert "Temperature round-trip"

      # Stage ONLY this leg's unit-specific goldens for the fan-in commit.
      # Uploading the full screenshots dir would mix in the sibling unit's
      # stale goldens and risk reverting whatever the other leg regenerated.
      - name: Stage regenerated goldens for artifact
        if: steps.run_tests.outcome == 'failure' && steps.verify.outcome == 'success'
        run: |
          UNIT_LABEL=$([ "${{ matrix.unit }}" = "C" ] && echo Celsius || echo Fahrenheit)
          mkdir -p /tmp/goldens
          cp e2e/screenshots/*-"${UNIT_LABEL}"-* /tmp/goldens/ 2>/dev/null || true

      - name: Upload regenerated goldens artifact
        if: steps.run_tests.outcome == 'failure' && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ matrix.unit }}
          path: /tmp/goldens/
          if-no-files-found: ignore
          retention-days: 1

      # Upload test results only on failure so reviewers can inspect diffs
      # when a test fails for a non-screenshot reason.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.unit }}
          path: e2e/test-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose ${{ steps.compose.outputs.files }} down -v

  # -----------------------------------------------------------------------
  # Fan-in: collect goldens from both parallel e2e legs and make one commit.
  # Runs after both legs finish (always, so it also runs when a leg fails).
  # If neither leg uploaded a goldens artifact (both passed), the download
  # step finds nothing and the git diff is empty — job exits cleanly.
  # -----------------------------------------------------------------------
  commit-goldens:
    name: Commit updated goldens
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the combined golden update back to the PR branch
      pull-requests: write # announce the golden rewrite on the PR (#415)

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Download goldens-F and goldens-C (if uploaded) into the screenshots
      # dir. merge-multiple flattens both artifacts into the same target path.
      # continue-on-error handles the common case where no artifacts exist
      # (both legs passed with no screenshot changes).
      - name: Download regenerated goldens
        uses: actions/download-artifact@v4
        with:
          pattern: goldens-*
          path: e2e/screenshots/
          merge-multiple: true
        continue-on-error: true

      - name: Commit and push if goldens changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- e2e/screenshots/
          if git diff --cached --quiet; then
            echo "No golden screenshot content changed — nothing to commit."
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          echo "Updated goldens: $CHANGED"
          # Commit first so the working tree is clean, then rebase onto the
          # remote tip (in case the branch advanced while CI was running) and
          # push. Rebase requires no staged/unstaged changes, so commit first.
          git commit -m "ci: update E2E golden screenshots (F + C)"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "GOLDENS_CHANGED<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGED" | tr ' ' '\n' | sed '/^$/d' >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # Make the rewrite impossible to miss (#415): the visual legs go GREEN
      # when their regenerate+verify pass succeeds, so without this comment
      # the only sign that every page screenshot changed is the bot commit in
      # the diff. The PNGs must be reviewed like code.
      - name: Announce the golden rewrite on the PR
        if: env.GOLDENS_CHANGED != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          COUNT=$(echo "$GOLDENS_CHANGED" | sed '/^$/d' | wc -l)
          {
            echo "🖼️ **CI regenerated $COUNT golden screenshot(s) and committed them to this branch.**"
            echo ""
            echo "The visual-regression legs are green because the regenerated goldens verified — review the changed PNGs in the diff like code before merging:"
            echo ""
            echo "$GOLDENS_CHANGED" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
