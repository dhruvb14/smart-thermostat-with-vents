name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - run: ruff check backend/
        working-directory: smart_vent
      - run: ruff format --check backend/
        working-directory: smart_vent

  python-test:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          python -m pytest backend/tests/ -v 2>&1 | tee coverage_output.txt
        working-directory: smart_vent
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/^Name.*Stmts/,/^TOTAL/' coverage_output.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage report not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: smart_vent

  frontend-lint:
    name: Frontend (ESLint + Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_vent/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart_vent/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          NO_COLOR=1 npm run test:coverage 2>&1 | tee coverage_output.txt
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Frontend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/Coverage report from v8/,0' coverage_output.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage report not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security (Trivy source scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy vulnerability scan on source
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-report.txt"

      - name: Parse Trivy results for critical vulnerabilities
        run: |
          if grep -q "CRITICAL" trivy-report.txt; then
            echo "❌ CRITICAL vulnerabilities found in dependencies!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No critical vulnerabilities found in dependencies" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Display full Trivy report in summary
        if: always()
        run: |
          echo "## Source Code Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy SARIF for GitHub Security tab
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker Image
        run: docker build -t plenum:test .
        working-directory: smart_vent
      - name: Run Container Smoke Test
        run: |
          # Start container with port exposed. HA_URL/HA_TOKEN are dummies — the HTTP
          # server binds before the HA client connects, so healthz is reachable even
          # without a real HA instance.
          docker run -d --name smoke-test \
            -p 8099:8099 \
            -e HA_URL=http://localhost:8123 \
            -e HA_TOKEN=dummy \
            plenum:test

          # Poll /api/healthz until HTTP 200 or 30s timeout
          echo "Waiting for /api/healthz to respond..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8099/api/healthz || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ /api/healthz returned 200 after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ /api/healthz did not respond within 30s"
              docker logs smoke-test
              docker stop smoke-test
              exit 1
            fi
            sleep 1
          done

          docker logs smoke-test
          docker stop smoke-test
          echo "Smoke test passed!"
