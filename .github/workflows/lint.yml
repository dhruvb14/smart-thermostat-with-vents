name: Lint & Test

# Path limiting is done with a job-level `if:` gate driven by the `changes`
# job below, NOT a workflow-level `paths`/`paths-ignore` filter. A job skipped
# by `if:` still reports "skipped" (which satisfies branch protection), whereas
# a path-filtered workflow never creates its required check and the PR hangs
# forever (the #412 lesson, mirrored from container-ci.yml). This also retires
# the old `paths-ignore: e2e/screenshots/**` goldens-only stuck-PR trap — the
# golden-bot loop is independently blocked because GITHUB_TOKEN pushes never
# re-trigger workflows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR (#414) — a force-push mid-run used to
# leave all five jobs running to completion. Push-to-main runs are never
# cancelled (each ref groups separately and cancel only applies to PRs).
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the diff so docs-only changes skip the lint/test/scan jobs. Uses
  # the SAME ignore set as container-ci.yml's `changes` job: root-level markdown
  # (README/CLAUDE/DESIGN/RELEASE), docs/, the .claude/ skill library, .jules/,
  # .vscode/, the README screenshots dir, and committed golden PNGs. .github/ is
  # deliberately NOT docs — a workflow edit must still run the full suite so we
  # can validate CI itself. Nested markdown outside those dirs counts as code.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need the base commit to diff against
      - name: Classify diff (code vs docs-only)
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            RANGE="${BASE_SHA}...HEAD"   # PR: merge-base diff against the base
          else
            RANGE="HEAD^ HEAD"           # push to main: the merged commit
          fi
          if ! git diff --name-only $RANGE > /tmp/changed.txt 2>/dev/null; then
            # Can't compute a diff — fail open and run everything.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          cat /tmp/changed.txt
          if grep -vE '^(docs/|\.claude/|\.jules/|\.vscode/|screenshots/|e2e/screenshots/)|^[^/]+\.md$' /tmp/changed.txt | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only diff — lint/test/scan jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  python-lint:
    name: Python (ruff)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_vent/pyproject.toml
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - run: ruff check backend/
        working-directory: smart_vent
      - run: ruff format --check backend/
        working-directory: smart_vent

  python-test:
    name: Python (pytest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_vent/pyproject.toml
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          python -m pytest backend/tests/ -v 2>&1 | tee coverage_output.txt
        working-directory: smart_vent
      # pyproject's `fail_under` (enforced by pytest via addopts) gates the
      # COMBINED statements+branches number. That single figure lets a branch
      # regression hide behind a statement gain, so pin each metric separately
      # here. Ratchet all three together, never down: they are the floor that
      # stops the suite silently rotting between features.
      - name: Enforce per-metric coverage floors
        run: |
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json, sys

          # Measured 99.98 statements / 99.85 branches over two consecutive
          # full runs. Ratchet these up as coverage rises; never down.
          STATEMENT_FLOOR = 99.90
          BRANCH_FLOOR = 99.75

          t = json.load(open("coverage.json"))["totals"]
          stmt = 100.0 * t["covered_lines"] / t["num_statements"]
          branch = 100.0 * t["covered_branches"] / t["num_branches"]

          failed = False
          for name, got, floor, missing in (
              ("statement", stmt, STATEMENT_FLOOR, t["missing_lines"]),
              ("branch", branch, BRANCH_FLOOR, t["num_partial_branches"]),
          ):
              status = "ok" if got >= floor else "BELOW FLOOR"
              print(f"{name:>10} coverage: {got:6.2f}%  (floor {floor:.2f}%, {missing} uncovered) {status}")
              if got < floor:
                  failed = True
          sys.exit(1 if failed else 0)
          PY
        working-directory: smart_vent
      # Mass-deletion tripwire, NOT a ratchet. Coverage floors already catch
      # most test removal, because deleting a test usually drops coverage — but
      # a test whose lines another test also happens to execute can be deleted
      # with the percentages unmoved. This catches that.
      #
      # The headroom below current is deliberate: CONSOLIDATING tests is
      # legitimate and this must not block it (this gate's own PR replaced eight
      # status-only vent tests with one parametrised test that actually asserts
      # the dispatched service). Raise the floor when the count grows a lot;
      # do not pin it tight to the current number.
      - name: Enforce test-count tripwire
        run: |
          MIN=2300
          COUNT=$(grep -oE '[0-9]+ passed' coverage_output.txt | tail -1 | grep -oE '[0-9]+')
          if [ -z "$COUNT" ]; then
            echo "could not parse a test count from coverage_output.txt"; exit 1
          fi
          echo "backend tests: $COUNT (tripwire $MIN)"
          if [ "$COUNT" -lt "$MIN" ]; then
            echo "::error::backend test count $COUNT is below the tripwire $MIN — a large number of tests was removed"
            exit 1
          fi
        working-directory: smart_vent
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/^Name.*Stmts/,/^TOTAL/' coverage_output.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage report not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: smart_vent

  python-typecheck:
    name: Python (mypy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_vent/pyproject.toml
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - run: mypy backend/ --ignore-missing-imports
        working-directory: smart_vent

  frontend-lint:
    name: Frontend (ESLint + Prettier)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_vent/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          # react-router 8 declares engines node >=22.22, and this is the only
          # job that installs and executes the frontend project (vitest imports
          # react-router under jsdom). The container-ci Node pins stay at 20:
          # those install e2e/ (Playwright), which never loads react-router.
          node-version: "22"
          cache: npm
          cache-dependency-path: smart_vent/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          NO_COLOR=1 npm run test:coverage 2>&1 | tee coverage_output.txt
      # Mass-deletion tripwire — see the rationale on the backend job's copy.
      # Headroom below current is deliberate so consolidation stays possible.
      - name: Enforce test-count tripwire
        run: |
          MIN=900
          COUNT=$(grep -oE 'Tests +[0-9]+ passed' coverage_output.txt | tail -1 | grep -oE '[0-9]+')
          if [ -z "$COUNT" ]; then
            echo "could not parse a test count from coverage_output.txt"; exit 1
          fi
          echo "frontend tests: $COUNT (tripwire $MIN)"
          if [ "$COUNT" -lt "$MIN" ]; then
            echo "::error::frontend test count $COUNT is below the tripwire $MIN — a large number of tests was removed"
            exit 1
          fi
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Frontend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/Coverage report from v8/,0' coverage_output.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage report not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security (Trivy source scan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      # One scan (#414): scan once in Trivy's native JSON, then derive both
      # artifacts (SARIF for the Security tab, table for humans) with
      # `trivy convert` instead of scanning the tree twice. Note `convert`
      # only accepts the native JSON report — it cannot read SARIF back.
      - name: Run Trivy vulnerability scan on source
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-output.json"
          # Passed explicitly rather than relying on Trivy's default pickup of
          # ./.trivyignore, so the source scan and the release-image scan in
          # container-ci.yml demonstrably read the same suppression list.
          trivyignores: ".trivyignore"

      - name: Derive SARIF and human-readable reports from scan output
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            convert --format sarif --output trivy-results.sarif trivy-output.json
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            convert --format table --output trivy-report.txt trivy-output.json

      - name: Parse Trivy results for critical vulnerabilities
        run: |
          # Check the actual Severity field in the native JSON report, not the
          # human-readable table: the table always prints a "CRITICAL: 0"
          # summary column whenever ANY vulnerability of ANY severity is found,
          # so a plain `grep -q "CRITICAL" trivy-report.txt` matches that zero
          # count and fails the build on non-critical findings (e.g. MEDIUM).
          CRITICAL_COUNT=$(jq '[.Results[]? | (.Vulnerabilities // [])[] | select(.Severity == "CRITICAL")] | length' trivy-output.json)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ $CRITICAL_COUNT CRITICAL vulnerabilities found in dependencies!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No critical vulnerabilities found in dependencies" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Display full Trivy report in summary
        if: always()
        run: |
          echo "## Source Code Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
