name: Lint & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'e2e/screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'e2e/screenshots/**'

permissions:
  contents: read

# Cancel superseded runs on the same PR (#414) — a force-push mid-run used to
# leave all five jobs running to completion. Push-to-main runs are never
# cancelled (each ref groups separately and cancel only applies to PRs).
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_vent/pyproject.toml
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - run: ruff check backend/
        working-directory: smart_vent
      - run: ruff format --check backend/
        working-directory: smart_vent

  python-test:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_vent/pyproject.toml
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          python -m pytest backend/tests/ -v 2>&1 | tee coverage_output.txt
        working-directory: smart_vent
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/^Name.*Stmts/,/^TOTAL/' coverage_output.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage report not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: smart_vent

  python-typecheck:
    name: Python (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart_vent/pyproject.toml
      - run: pip install ".[dev]"
        working-directory: smart_vent
      - run: mypy backend/ --ignore-missing-imports
        working-directory: smart_vent

  frontend-lint:
    name: Frontend (ESLint + Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_vent/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart_vent/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          NO_COLOR=1 npm run test:coverage 2>&1 | tee coverage_output.txt
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### Frontend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/Coverage report from v8/,0' coverage_output.txt >> $GITHUB_STEP_SUMMARY || echo "Coverage report not found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security (Trivy source scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      # One scan (#414): produce SARIF (the machine artifact) and derive the
      # human-readable table from it with `trivy convert` instead of scanning
      # the tree twice.
      - name: Run Trivy vulnerability scan on source
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Render human-readable report from SARIF scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest \
            convert --format table --output trivy-report.txt trivy-results.sarif

      - name: Parse Trivy results for critical vulnerabilities
        run: |
          if grep -q "CRITICAL" trivy-report.txt; then
            echo "❌ CRITICAL vulnerabilities found in dependencies!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No critical vulnerabilities found in dependencies" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Display full Trivy report in summary
        if: always()
        run: |
          echo "## Source Code Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
