# Test-only Mosquitto config for the MQTT round-trip CI leg (#519).
#
# Anonymous access on purpose: the leg exercises Plenum's topic tree and command
# handling, not broker authentication. #519's security model is explicitly "trust
# the broker's own ACLs", so credentials are the operator's concern, not
# something this test has an opinion about.
#
# NEVER use this config for a real broker — it accepts any client with no
# credentials on all interfaces.
listener 1883
allow_anonymous true

# Keep the container in the foreground so Docker manages the lifecycle, and send
# logs to stdout so `docker compose logs mosquitto` shows them on a failure.
log_dest stdout
