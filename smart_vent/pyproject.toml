[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "plenum"
version = "0.9.13"
description = "HVAC cycle manager add-on for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "python-dotenv>=1.0.0",
    "mcp>=1.0",
    "python-dateutil>=2.9",
    "uvloop>=0.19; sys_platform != 'win32'",
    "setuptools>=70",
    "aiohttp-apispec>=2.2.3",
    "marshmallow>=3.21,<4.0",
    "marshmallow-dataclass>=8.7.1",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1.0",
    "aioresponses>=0.7",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/mcp_server.py", "backend/mcp_tools/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (undefined names, unused imports)
  "I",   # isort (import ordering)
  "B",   # flake8-bugbear (common bugs and anti-patterns)
  "UP",  # pyupgrade (modernise syntax)
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]  # allow assert in tests

[tool.setuptools.packages.find]
include = ["backend*"]
