[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "plenum"
version = "0.36.0"
description = "HVAC cycle manager add-on for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.3",
    "mcp>=2.1.1",
    "uvicorn>=0.52.4",
    "python-dateutil>=2.9.0.post0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "setuptools>=82.0.1",
    "apispec[marshmallow]>=6.10.0",
    "swagger-ui-bundle>=1.1.0",
    "marshmallow>=4.3.0,<5.0",
    "marshmallow-dataclass>=8.7.1",
    "certifi",
    # OIDC single sign-on for the web UI (#464). Authlib supplies the OAuth
    # primitives (CSPRNG state/nonce/PKCE verifier + S256 challenge); joserfc —
    # the maintained successor to the deprecated authlib.jose submodule — does the
    # ID-token (JWT/JWKS) signature + claims validation. See backend/oidc.py.
    "authlib>=1.8.0",
    "joserfc>=1.7.5",
    # MQTT interface for HA automations (#519). asyncio-native wrapper over
    # paho-mqtt; only backend/mqtt/client.py imports it, so the bridge logic
    # stays testable without a broker.
    "aiomqtt>=2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "types-python-dateutil",
    # In-process MQTT broker (#519). Lets test_mqtt_real_broker.py drive the
    # real aiomqtt client over a real wire without Docker, so the CI mosquitto
    # leg is a confirmation rather than the only place the transport is proven.
    # The test skips itself if this is missing.
    "amqtt>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
# Branch coverage is ON. A statement can be executed without both of its
# outcomes ever being taken, so statement-only coverage silently passes code
# whose guard has only ever been seen one way round — which is most of the
# engine's safety logic. `BrPart` in the report is the count that matters.
branch = true
# `backend/mcp_server.py` and `backend/mcp_tools/*` used to sit here alongside
# the tests. `omit` suppresses COLLECTION, not just reporting, so those 372
# statements never entered the denominator at all and nobody could see that the
# MCP tool surface had drifted to 76.9% (status.py 45.8%, ha_entities.py 48.3%,
# rooms.py 62.2%). They are now covered and held to the same bar as the rest of
# the backend; do not re-add them here.
#
# They were never excluded from mypy either, and must not be: that exclusion is
# what let `set_thermostat_config` assign a `ThermostatConfig` attribute that no
# longer existed (Issue #579). Do not add a `[[tool.mypy.overrides]]` block for
# these modules.
omit = ["backend/tests/*"]

[tool.coverage.report]
# Combined statements+branches. The separate per-metric floors live in
# .github/workflows/lint.yml, because coverage.py's fail_under is a single
# number and a branch regression can otherwise hide behind a statement gain.
fail_under = 98.15
show_missing = true
precision = 2
# `asyncio.run(main())` under `if __name__ == "__main__":` cannot execute while
# the module is imported as `backend.mcp_server` by pytest. This is the standard
# idiom, not a coverage suppression — do not extend this list to skip real code.
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "aiosqlite.*",
  "marshmallow_dataclass.*",
  "apispec.*",
  "swagger_ui_bundle.*",
  "authlib.*",
  "joserfc.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.tests.test_api_spec_enforcement"]
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (undefined names, unused imports)
  "I",   # isort (import ordering)
  "B",   # flake8-bugbear (common bugs and anti-patterns)
  "UP",  # pyupgrade (modernise syntax)
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]  # allow assert in tests

[tool.setuptools.packages.find]
include = ["backend*"]
