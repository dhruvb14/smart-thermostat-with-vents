[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "plenum"
version = "0.22.1"
description = "HVAC cycle manager add-on for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.2",
    "mcp>=1.28.1",
    "uvicorn>=0.34.0",
    "python-dateutil>=2.9.0.post0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "setuptools>=82.0.1",
    "apispec[marshmallow]>=6.10.0",
    "swagger-ui-bundle>=1.1.0",
    "marshmallow>=4.3.0,<5.0",
    "marshmallow-dataclass>=8.7.1",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "aioresponses>=0.7.9",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "types-python-dateutil",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/mcp_server.py", "backend/mcp_tools/*"]

[tool.coverage.report]
fail_under = 92.5
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "aiosqlite.*",
  "marshmallow_dataclass.*",
  "apispec.*",
  "swagger_ui_bundle.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "backend.mcp_tools.*",
  "backend.mcp_server",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["backend.tests.test_api_spec_enforcement"]
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (undefined names, unused imports)
  "I",   # isort (import ordering)
  "B",   # flake8-bugbear (common bugs and anti-patterns)
  "UP",  # pyupgrade (modernise syntax)
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]  # allow assert in tests

[tool.setuptools.packages.find]
include = ["backend*"]
