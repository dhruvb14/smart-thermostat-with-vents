name: "Flair Replacement"
description: "HVAC cycle manager using Flair vents and Home Assistant thermostats"
version: "0.1.2"
slug: "flair_replacement"
url: "https://github.com/dhruvb14/smart-thermostat-with-vents"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
panel_title: Flair Replacement
homeassistant_api: true
hassio_api: true
auth_api: true
options:
  ha_url: ""
  ha_token: ""
schema:
  ha_url: str
  ha_token: str
environment:
  DATA_DIR: /data
map:
  - data
