name: "Flair Replacement"
description: "HVAC cycle manager using Flair vents and Home Assistant thermostats"
version: "0.6.4"
slug: "flair_replacement"
url: "https://github.com/dhruvb14/smart-thermostat-with-vents"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
panel_title: Flair Replacement
homeassistant_api: true
hassio_api: true
auth_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Web UI — leave blank to disable direct access, set a port to expose it on the host"
options:
  ha_url: ""
  ha_token: ""
  use_wss: false
  ssl_verify: true
  # Timezone for schedule evaluation. Examples: America/New_York, America/Chicago,
  # America/Denver, America/Los_Angeles, Europe/London, Europe/Paris, Asia/Tokyo
  timezone: "America/New_York"
schema:
  ha_url: str
  ha_token: str
  use_wss: bool
  ssl_verify: bool
  timezone: str
environment:
  DATA_DIR: /data
map:
  - data
