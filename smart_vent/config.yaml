name: "Plenum"
description: "HVAC zoning controller — drives HA cover entities and climate thermostats for per-room comfort"
version: "0.33.0"
slug: "plenum"
image: "ghcr.io/dhruvb14/smart-thermostat-with-vents"
url: "https://github.com/dhruvb14/smart-thermostat-with-vents"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
panel_title: Plenum
homeassistant_api: true
hassio_api: true
auth_api: true
ports:
  8099/tcp: null
  9099/tcp: null
ports_description:
  8099/tcp: "Web UI — leave blank to disable direct access, set a port to expose it on the host"
  9099/tcp: "MCP server (Model Context Protocol) — leave blank to disable, set a port to expose it on the host, then attach an MCP client at http://<host>:<port>/mcp. Also turn the MCP server on in Plenum's settings (it returns 503 until enabled)."
options:
  ha_url: ""
  ha_token: ""
  use_wss: false
  ssl_verify: true
  # Timezone for schedule evaluation. Examples: America/New_York, America/Chicago,
  # America/Denver, America/Los_Angeles, Europe/London, Europe/Paris, Asia/Tokyo
  timezone: "America/New_York"
  # Temperature unit override. Set to "F" or "C" to lock the display unit.
  # Leave blank to auto-detect from Home Assistant's unit_system setting.
  temperature_unit: ""
  # Require authentication on directly-exposed ports and the MCP server (#373).
  # Home Assistant ingress is ALWAYS trusted and is never affected by this — it
  # only gates the raw web-UI/MCP host ports (8099/9099) when you publish them.
  # true  = direct-port callers must log in with their HA account; MCP needs a
  #         minted bearer token (default, secure).
  # false = legacy fully-open behavior on the raw ports (pre-#373).
  require_auth: true
  # OpenID Connect single sign-on for the web UI (#464). OPTIONAL. Leave blank to
  # keep the default Home Assistant username/password login on published ports.
  # When oidc_configuration_url + oidc_client_id + oidc_client_secret +
  # plenum_external_url are ALL set, the web UI shows a "Sign in with <name>"
  # button and the password login is disabled. This closes the direct-port MFA
  # gap (your identity provider enforces MFA) and works with no Supervisor
  # (standalone Docker). MCP is unaffected — it keeps its bearer tokens; front the
  # MCP port with an OIDC proxy (see docs/mcp.md) if you need SSO there. Home
  # Assistant ingress is always trusted and never sees any of this.
  #   oidc_configuration_url: your IdP's .well-known/openid-configuration URL
  #   oidc_client_id / oidc_client_secret: the OAuth client you register for Plenum
  #   oidc_scopes: space-separated scopes (must include "openid")
  #   oidc_allowed_users_glob: glob over email/username allowed in ("*" = anyone)
  #   oidc_provider_name: label for the button, e.g. "Authelia" or "Google"
  #   plenum_external_url: public base URL of the web UI; the OIDC redirect URI is
  #     <plenum_external_url>/api/auth/oidc/callback — register that at your IdP
  oidc_configuration_url: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  oidc_scopes: "openid email profile"
  oidc_allowed_users_glob: "*"
  oidc_provider_name: ""
  plenum_external_url: ""
  # MQTT interface for Home Assistant automations (#519). OPTIONAL and off by
  # default. Turning this on only makes the bridge *available* — you still flip
  # "MQTT bridge" on in Plenum's Settings page, exactly like the MCP server.
  #   mqtt_host/port/user/password: leave blank on HAOS — the broker is
  #     discovered from the Supervisor's built-in MQTT service. Set them for
  #     standalone Docker, or to point at a broker other than the built-in one.
  #   mqtt_discovery: publish HA MQTT Discovery configs so every control shows
  #     up as a real HA entity usable in the automation UI with no YAML.
  #   mqtt_discovery_prefix: must match the HA MQTT integration's discovery
  #     prefix. Only change it if you changed it there.
  #   mqtt_topic_prefix: overrides the per-install topic prefix. Defaults to the
  #     add-on slug (plenum / plenum_beta) on HAOS. Standalone Docker has no
  #     slug, so set this if two Plenum containers share one broker.
  mqtt_enabled: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_discovery: true
  mqtt_discovery_prefix: "homeassistant"
  mqtt_topic_prefix: ""
schema:
  ha_url: str
  ha_token: str
  use_wss: bool
  ssl_verify: bool
  timezone: str
  temperature_unit: str
  require_auth: bool
  oidc_configuration_url: str
  oidc_client_id: str
  oidc_client_secret: password
  oidc_scopes: str
  oidc_allowed_users_glob: str
  oidc_provider_name: str
  plenum_external_url: str
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  mqtt_discovery: bool
  mqtt_discovery_prefix: str
  mqtt_topic_prefix: str
# Ask the Supervisor for the built-in MQTT broker's connection details. "want"
# rather than "need": Plenum runs perfectly well with no broker at all, and a
# hard dependency would block the add-on from starting for every user who does
# not use the MQTT interface (#519).
services:
  - mqtt:want
environment:
  DATA_DIR: /config
map:
  - data
  - addon_config:rw
