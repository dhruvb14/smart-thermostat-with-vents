name: "Plenum"
description: "HVAC zoning controller — drives HA cover entities and climate thermostats for per-room comfort"
version: "0.30.0"
slug: "plenum"
image: "ghcr.io/dhruvb14/smart-thermostat-with-vents"
url: "https://github.com/dhruvb14/smart-thermostat-with-vents"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
panel_title: Plenum
homeassistant_api: true
hassio_api: true
auth_api: true
ports:
  8099/tcp: null
  9099/tcp: null
ports_description:
  8099/tcp: "Web UI — leave blank to disable direct access, set a port to expose it on the host"
  9099/tcp: "MCP server (Model Context Protocol) — leave blank to disable, set a port to expose it on the host, then attach an MCP client at http://<host>:<port>/mcp. Also turn the MCP server on in Plenum's settings (it returns 503 until enabled)."
options:
  ha_url: ""
  ha_token: ""
  use_wss: false
  ssl_verify: true
  # Timezone for schedule evaluation. Examples: America/New_York, America/Chicago,
  # America/Denver, America/Los_Angeles, Europe/London, Europe/Paris, Asia/Tokyo
  timezone: "America/New_York"
  # Temperature unit override. Set to "F" or "C" to lock the display unit.
  # Leave blank to auto-detect from Home Assistant's unit_system setting.
  temperature_unit: ""
  # Require authentication on directly-exposed ports and the MCP server (#373).
  # Home Assistant ingress is ALWAYS trusted and is never affected by this — it
  # only gates the raw web-UI/MCP host ports (8099/9099) when you publish them.
  # true  = direct-port callers must log in with their HA account; MCP needs a
  #         minted bearer token (default, secure).
  # false = legacy fully-open behavior on the raw ports (pre-#373).
  require_auth: true
schema:
  ha_url: str
  ha_token: str
  use_wss: bool
  ssl_verify: bool
  timezone: str
  temperature_unit: str
  require_auth: bool
environment:
  DATA_DIR: /config
map:
  - data
  - addon_config:rw
