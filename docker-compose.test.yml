services:
  # Copies our configuration.yaml into the HA data volume before HA starts.
  ha-init:
    image: alpine:3.20
    volumes:
      - ha-data:/config
      - ./e2e/fixtures/ha-config:/source:ro
    command: sh -c "cp /source/configuration.yaml /config/configuration.yaml && echo 'HA config injected.'"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2025.5.3
    volumes:
      - ha-data:/config
    ports:
      - "8123:8123"
    depends_on:
      ha-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # curl exits 0 on any valid HTTP response (including 401 Unauthorized when
      # auth is required). Non-zero only on connection failure.
      test: ["CMD-SHELL", "curl -s http://localhost:8123/api/config -o /dev/null"]
      interval: 10s
      timeout: 5s
      # start_period gives HA time to initialise before failures count.
      # Set high enough for CI where HA startup can take 60–90 s after pull.
      retries: 24
      start_period: 90s

  # HA_TOKEN is injected from the shell environment (set by the CI workflow
  # after running e2e/scripts/setup-ha.py).
  plenum:
    # Reuse a pre-built image when one is provided. CI builds + pushes the image
    # once to ghcr.io/<repo>:ci-<sha> and sets PLENUM_IMAGE so every E2E leg
    # pulls that single image instead of rebuilding (see
    # .github/workflows/container-ci.yml). When PLENUM_IMAGE is unset (local
    # dev), Compose uses the local `plenum-e2e` image — building it from
    # `build:` if it isn't already present.
    image: "${PLENUM_IMAGE:-plenum-e2e}"
    build:
      context: ./smart_vent
    ports:
      - "8099:8099"
    environment:
      HA_URL: "http://homeassistant:8123"
      HA_TOKEN: "${HA_TOKEN}"
      TEMPERATURE_UNIT: "F"
      DATA_DIR: "/data"
      # This stack runs Plenum on the raw port with NO Home Assistant Supervisor
      # in front, so every request is "direct" (never ingress). The functional
      # round-trip and visual-regression E2E suites exercise the app itself, not
      # the #373 auth boundary, so we opt into legacy open mode here; a default
      # `true` would 401 every request (including the /api/healthz healthcheck).
      # The auth boundary is covered by backend integration tests instead; a
      # dedicated require_auth=true E2E stack is future work (see docs/auth.md).
      REQUIRE_AUTH: "false"
      # Pin the backend's notion of "now" for the room active-status read path so
      # the schedule-status line renders deterministically in the visual-regression
      # goldens (see tz.now_utc / #456). Wed 2025-06-04 10:00 ET — a weekday inside
      # the 08:00–17:00 seeded window (→ one room "via Schedule") and inside the
      # demo-seed week (CI_METRICS_RANGE). TIMEZONE makes the UTC→local conversion
      # explicit and matches the HA fixture's America/New_York. Playwright pins the
      # browser clock to the same absolute instant (14:00Z) — see e2e/fixtures.ts.
      PLENUM_CLOCK_OVERRIDE: "2025-06-04T10:00:00-04:00"
      TIMEZONE: "America/New_York"
    depends_on:
      homeassistant:
        condition: service_started
    volumes:
      - plenum-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8099/api/healthz -o /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

volumes:
  ha-data:
  plenum-data:
